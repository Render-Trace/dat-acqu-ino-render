<!doctype html>
<html>

<head>
    <title>Gráficos teste</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Gráficos com dados simulados</h1>
    <div class="graficos">
        <div class="grafico"><canvas id="sensorDistancia1"></canvas></div>
        <div class="grafico"><canvas id="sensorDistancia2"></canvas></div>
        <div class="grafico"><canvas id="sensorDistancia3"></canvas></div>
        <div class="grafico"><canvas id="sensorDistancia4"></canvas></div>
    </div>

    <script>
        let sensores = [];
        let cores = ['#ED145B', '#0762C8', '#55A630', '#F4A261'];

        for (let numero = 1; numero <= 4; numero++) {
            sensores.push({
                chave: 'sensorDistancia' + numero,
                grafico: new Chart(document.getElementById('sensorDistancia' + numero).getContext('2d'), {
                    type: 'line',
                    data: {
                        labels: [],
                        datasets: [{
                            label: 'Tolva ' + numero,
                            borderColor: '#63B1BC',
                            backgroundColor: cores[numero - 1]
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: { beginAtZero: true },
                            y: {
                                title: { display: true, text: 'Distância' },
                                beginAtZero: true
                            }
                        }
                    }
                })
            });
        }

        let paginacao = {};
        let tempo = {};

        function obterDados() {
            fetch('http://localhost:3300/sensores/digital')
                .then(response => response.json())
                .then(dados => {
                    for (let i = 0; i < sensores.length; i++) {
                        let chave = sensores[i].chave;
                        let grafico = sensores[i].grafico;
                        if (paginacao[chave] == null) paginacao[chave] = 0;
                        if (tempo[chave] == null) tempo[chave] = 0;
                        let novosValores = dados[chave].slice(paginacao[chave]);
                        paginacao[chave] = dados[chave].length;

                        novosValores.forEach((valor) => {
                            if (grafico.data.labels.length == 10 && grafico.data.datasets[0].data.length == 10) {
                                grafico.data.labels.shift();
                                grafico.data.datasets[0].data.shift();
                            }
                            grafico.data.labels.push(tempo[chave]++);
                            grafico.data.datasets[0].data.push(parseFloat(valor));
                        });
                        if (novosValores.length > 0) grafico.update();
                    }
                })
                .catch(error => console.error('Erro ao obter dados:', error));
        }

        obterDados();
        setInterval(obterDados, 1000);

    </script>
</body>

</html>
